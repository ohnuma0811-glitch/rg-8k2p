<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Super Kyugo &amp; Soki Kart</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1c3c88">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- タイトルのロゴの文字（無料の Google Fonts。読めないときは、ふつうの文字で出る） -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&display=swap">
  <link rel="stylesheet" href="style.css?v=cdf967c">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="speed-lines"></div>
  <div id="space-flash"></div>
  <div id="touch-layer"></div>
  <!-- スピード計と操作ボタンは、ゲームを読みこんでレースが始まるまで隠しておく（開いたときに一瞬出ないように） -->
  <div id="btn-left" class="btn hidden">◀</div>
  <div id="btn-right" class="btn hidden">▶</div>
  <div id="btn-brake" class="btn hidden">▼</div>
  <div id="btn-drift" class="btn hidden">DRIFT</div>
  <div id="btn-item" class="btn hidden">ITEM</div>
  <div id="speedo" class="hidden"><span class="ghost">888</span><span class="num">  0</span><span class="unit">km/h</span></div>
  <div id="wrongway">↺ WRONG WAY!</div>
  <div id="bump-warn"><b>BUMP!</b><span>SLOW DOWN ≤150 km/h</span></div>
  <div id="race-hud">
    <div id="lap-box"><div id="lap">LAP 1/3</div><div id="race-time">0:00.00</div></div>
    <button id="btn-pause" type="button" aria-label="Pause">❚❚</button>
    <div id="side"><canvas id="minimap"></canvas></div>
    <ol id="top3"></ol>
    <div id="rank">5th</div>
    <div id="countdown"></div>
    <div id="vs-countdown"></div>
    <div id="stage-banner"><div class="no"></div><div class="name"></div></div>
    <div id="time-left"></div>
    <div id="item-slot"><div class="icon"></div></div>
  </div>
  <div id="vignette"></div>
  <div id="item-flash"></div>
  <div id="hud"></div>
  <div id="menu"></div>
  <div id="fade"></div>
  <div id="rotate">Turn your device</div>
  <div id="safe-probe"></div>
  <script type="module" src="src/main.js?v=cdf967c"></script>
</body>
</html>
